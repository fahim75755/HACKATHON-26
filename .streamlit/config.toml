[theme]
base = "light"
primaryColor = "#246A73"
backgroundColor = "#F5F7F6"
secondaryBackgroundColor = "#EDF4F4"
textColor = "#16323B"
font = "sans serif"

[client]
# Hide Streamlit's developer tools (Rerun, Clear cache, Print, Record screen, Deploy, menu).
toolbarMode = "minimal"
[browser]
# R5: no usage telemetry, so the app makes no network call of its own when offline.
gatherUsageStats = false
